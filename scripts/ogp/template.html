<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>OGP</title>
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{
    --ink:#0A0D13; --ink-2:#10151F; --rule:#252D3D;
    --fg:#ECEEF3; --fg-mid:#A8B0C0; --fg-mute:#6E7889; --seal:#B23A2B;
    --f-mincho:'Shippori Mincho B1','Hiragino Mincho ProN',serif;
    --f-gothic:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
    --f-en:'Archivo','Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--ink);color:var(--fg);overflow:hidden;position:relative}

  /* 左上のにじみ。サイトのヒーローと同じ処理 */
  .glow{
    position:absolute;left:-180px;top:-220px;width:900px;height:760px;
    background:radial-gradient(closest-side,rgba(60,86,140,.30),transparent 72%);
    filter:blur(10px);
  }
  /* 紙の粒子 */
  .grain{
    position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }
  /* 右の写真。左端を地に溶かす */
  .photo{
    position:absolute;right:0;top:0;width:600px;height:630px;
    background-size:cover;background-position:42% 30%;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 55%);
            mask-image:linear-gradient(90deg,transparent 0,#000 55%);
    filter:saturate(.9) contrast(1.03);
  }
  .photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(10,13,19,.9) 0,rgba(10,13,19,.25) 45%,rgba(10,13,19,0) 78%);
  }

  .in{position:absolute;inset:0;padding:56px 64px;display:flex;flex-direction:column}

  .mark{display:flex;align-items:baseline;gap:14px}
  .mark b{font-family:var(--f-mincho);font-size:22px;font-weight:500;letter-spacing:.1em}
  .mark span{font-family:var(--f-en);font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--fg-mute)}

  .label{
    font-family:var(--f-en);font-size:12px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
    color:var(--fg-mute);display:flex;align-items:center;gap:16px;margin-top:52px;
  }
  .label i{display:block;width:74px;height:1px;background:var(--rule)}

  h1{
    font-family:var(--f-mincho);font-weight:500;font-size:60px;line-height:1.34;
    letter-spacing:.02em;margin-top:16px;max-width:730px;
  }
  h1 em{font-style:normal;font-weight:700}
  h1.sm{font-size:50px;line-height:1.4}

  .sub{
    font-family:var(--f-gothic);font-size:16px;line-height:1.9;color:var(--fg-mid);
    margin-top:18px;max-width:600px;
  }

  .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .who b{display:block;font-family:var(--f-mincho);font-size:22px;font-weight:500;letter-spacing:.06em}
  .who span{display:block;font-family:var(--f-gothic);font-size:13px;color:var(--fg-mute);margin-top:6px}

  .nums{display:flex;gap:30px;margin-top:22px}
  .num i{
    display:block;font-family:var(--f-en);font-size:30px;font-weight:800;font-style:normal;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  }
  .num i small{font-size:12px;font-weight:700;letter-spacing:.06em;margin-left:4px;color:var(--fg-mute)}
  .num span{display:block;font-family:var(--f-gothic);font-size:11px;color:var(--fg-mute);margin-top:2px}

  .seal{
    position:absolute;right:64px;top:56px;width:38px;height:38px;border-radius:3px;
    background:var(--seal);color:#fff;font-family:var(--f-mincho);font-size:19px;
    display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="photo" id="photo"></div>
  <div class="grain"></div>
  <div class="seal">健</div>

  <div class="in">
    <div class="mark"><b>小澤健祐</b><span>OZAKEN.AI</span></div>

    <p class="label" id="label"><i></i><span id="labelText">Vision</span></p>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>

    <div class="foot">
      <div class="who">
        <b>小澤健祐（おざけん）</b>
        <span>一般社団法人AICX協会 代表理事</span>
        <div class="nums">
          <div class="num"><i>300<small>回／年</small></i><span>講演・登壇</span></div>
          <div class="num"><i>1,500<small>本超</small></i><span>記事執筆</span></div>
          <div class="num"><i>50,000<small>名超</small></i><span>Udemy受講者</span></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const V = {
    main: {
      label: 'Vision',
      h1: '人間とAIが<br><em>共存する社会</em>をつくる。',
      sub: '生成AIとAIエージェントの導入を、経営の意思決定と現場の実装の両側から支えています。',
    },
    speaking: {
      label: 'Speaking',
      h1: '生成AI・AIエージェントの<br>講演・研修・アドバイザリー',
      sm: true,
      sub: '経営層向けの基調講演から、全社リテラシー研修、実装ワークショップ、顧問まで。聞き手と目的に合わせて構成します。',
    },
  };
  const v = V[new URLSearchParams(location.search).get('v') || 'main'];
  document.getElementById('labelText').textContent = v.label;
  const h1 = document.getElementById('h1');
  h1.innerHTML = v.h1;
  if (v.sm) h1.classList.add('sm');
  document.getElementById('sub').textContent = v.sub;
  document.getElementById('photo').style.backgroundImage = 'url(stage.jpg)';
</script>
</body>
</html>
